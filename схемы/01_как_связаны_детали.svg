<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="560" viewBox="0 0 1250 560"><rect width="100%" height="100%" fill="white"/><g fill="none" stroke="black" stroke-width="2"><text x="30" y="40" stroke="none" fill="black" font-family="Arial, sans-serif" font-size="28">Два окна — одна программа</text><rect x="30" y="70" width="460" height="270" rx="3"/><text x="50" y="105" stroke="none" fill="black" font-family="Arial, sans-serif" font-size="24">Окно 1: регистрация и вход</text><text x="50" y="150" stroke="none" fill="black" font-family="Arial, sans-serif" font-size="20">Логин</text><rect x="50" y="160" width="410" height="40" rx="3"/><text x="60" y="187" stroke="none" fill="black" font-family="Arial, sans-serif" font-size="20">shop_student</text><text x="50" y="220" stroke="none" fill="black" font-family="Arial, sans-serif" font-size="20">Пароль</text><rect x="50" y="230" width="410" height="40" rx="3"/><text x="60" y="257" stroke="none" fill="black" font-family="Arial, sans-serif" font-size="20">********</text><rect x="50" y="290" width="230" height="35" rx="3"/><text x="60" y="315" stroke="none" fill="black" font-family="Arial, sans-serif" font-size="18">Зарегистрироваться</text><rect x="300" y="290" width="160" height="35" rx="3"/><text x="345" y="315" stroke="none" fill="black" font-family="Arial, sans-serif" font-size="18">Войти</text><path d="M520 190 L650 190"/><text x="535" y="170" stroke="none" fill="black" font-family="Arial, sans-serif" font-size="16">Верный</text><text x="535" y="215" stroke="none" fill="black" font-family="Arial, sans-serif" font-size="16">пароль</text><rect x="680" y="70" width="540" height="270" rx="3"/><text x="700" y="108" stroke="none" fill="black" font-family="Arial, sans-serif" font-size="24">Окно 2: склад (Toplevel)</text><text x="700" y="150" stroke="none" fill="black" font-family="Arial, sans-serif" font-size="20">Форма добавления товара</text><text x="700" y="190" stroke="none" fill="black" font-family="Arial, sans-serif" font-size="20">Диапазон и сортировка цен</text><text x="700" y="230" stroke="none" fill="black" font-family="Arial, sans-serif" font-size="20">Таблица товаров + прокрутка</text><text x="700" y="285" stroke="none" fill="black" font-family="Arial, sans-serif" font-size="20">Крестик / «Выйти» → вернуть окно 1</text><text x="30" y="390" stroke="none" fill="black" font-family="Arial, sans-serif" font-size="20">Регистрация: Entry → проверка → защищённый пароль → INSERT в shop_users</text><text x="30" y="435" stroke="none" fill="black" font-family="Arial, sans-serif" font-size="20">Вход: SELECT пользователя → проверка пароля → скрыть вход → открыть склад</text><text x="30" y="480" stroke="none" fill="black" font-family="Arial, sans-serif" font-size="20">Добавление: пять Entry → проверка → INSERT товара → новый SELECT → Treeview</text><text x="30" y="525" stroke="none" fill="black" font-family="Arial, sans-serif" font-size="18">Важно: очистка виджета и закрытие окна не удаляют записи PostgreSQL.</text></g></svg>