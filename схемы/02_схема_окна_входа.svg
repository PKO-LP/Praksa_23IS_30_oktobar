<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440"><rect width="100%" height="100%" fill="white"/><g fill="none" stroke="black" stroke-width="2"><rect x="20" y="20" width="490" height="390" rx="3"/><text x="40" y="55" stroke="none" fill="black" font-family="Arial, sans-serif" font-size="24">Склад — регистрация и вход</text><text x="80" y="108" stroke="none" fill="black" font-family="Arial, sans-serif" font-size="20">Логин: от 3 до 30 символов</text><rect x="80" y="120" width="360" height="40" rx="3"/><text x="92" y="147" stroke="none" fill="black" font-family="Arial, sans-serif" font-size="20">shop_student</text><text x="80" y="195" stroke="none" fill="black" font-family="Arial, sans-serif" font-size="20">Пароль: от 6 до 128 символов</text><rect x="80" y="207" width="360" height="40" rx="3"/><text x="92" y="234" stroke="none" fill="black" font-family="Arial, sans-serif" font-size="20">********</text><rect x="125" y="275" width="270" height="40" rx="3"/><text x="148" y="302" stroke="none" fill="black" font-family="Arial, sans-serif" font-size="20">Зарегистрироваться</text><rect x="180" y="335" width="160" height="40" rx="3"/><text x="230" y="362" stroke="none" fill="black" font-family="Arial, sans-serif" font-size="20">Войти</text><text x="550" y="90" stroke="none" fill="black" font-family="Arial, sans-serif" font-size="20">1. Ввести новый логин и пароль.</text><text x="550" y="135" stroke="none" fill="black" font-family="Arial, sans-serif" font-size="20">2. Нажать «Зарегистрироваться».</text><text x="550" y="180" stroke="none" fill="black" font-family="Arial, sans-serif" font-size="20">3. Снова ввести пароль.</text><text x="550" y="225" stroke="none" fill="black" font-family="Arial, sans-serif" font-size="20">4. Нажать «Войти».</text><text x="550" y="295" stroke="none" fill="black" font-family="Arial, sans-serif" font-size="17">Это схема, а не снимок запущенного окна.</text><text x="550" y="330" stroke="none" fill="black" font-family="Arial, sans-serif" font-size="17">Сначала регистрируем свою учётную запись.</text></g></svg>